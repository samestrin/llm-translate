name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.17.3
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest --cov=llm_translate --cov=main --cov-report=term --cov-fail-under=99

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Component tests
        run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            evals/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r evals/requirements.txt
      - name: Runner tests
        run: pytest evals/tests
      - name: Run the evals against the fake server
        run: python evals/run.py --fake --no-write

  embassy-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install PyYAML and pytest
        run: pip install pyyaml pytest
      - name: Checker tests (one mutant per guard)
        run: pytest scripts/tests
      # The real .env.embassy exists only on embassy (docs/deploy/embassy.md).
      - name: Placeholder env file
        run: touch .env.embassy
      - name: Compose config
        run: docker compose -f docker-compose.embassy.yml config --quiet
      - name: No host port, mount or model server
        run: |
          docker compose -f docker-compose.embassy.yml config --format json \
            | python scripts/check_embassy_compose.py docker-compose.embassy.yml

  # The demo on a fresh clone: no .env files, no key. Both services must reach
  # healthy and the page must load (docker-compose.yml, EST-5687).
  demo-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: The checkout has no .env file
        run: test -z "$(find . -name .env -not -path './.git/*')"
      - name: Compose config (demo, and with the dev override)
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: An unset model variable does not blank backend/.env
        run: |
          printf 'LLM_TRANSLATE_MODEL=from-backend-env\n' > backend/.env
          test "$(docker compose config --format json | jq -r .services.backend.environment.LLM_TRANSLATE_MODEL)" = from-backend-env
          test "$(LLM_TRANSLATE_MODEL=from-shell docker compose config --format json | jq -r .services.backend.environment.LLM_TRANSLATE_MODEL)" = from-shell
          rm backend/.env
      - name: Up, both services healthy
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: The page and the API answer
        run: |
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Down
        if: always()
        run: docker compose down --volumes
