    <!-- The accent is --color-accent from frontend/src/theme.css, light and dark.
         Scalar's own theme variables sit in @layer scalar-theme, so these unlayered
         rules win. tests/integration/test_openapi_docs.py checks both colours against theme.css. -->
    <style>
      .light-mode {
        --scalar-color-accent: #0f766e;
      }
      .dark-mode {
        --scalar-color-accent: #5eead4;
      }
    </style>

  <body>
    <!-- The spec and the script load by relative URL: behind Traefik this page is
         /api/docs and on port 8000 it is /docs, and each resolves against its own
         prefix. withDefaultFonts, proxyUrl and telemetry are the defaults of the
         pinned Scalar (static/SOURCES.md) that reach outside: its web font host and
         its request proxy. All three are off, so the page loads nothing but this
         origin's openapi.json and docs/scalar.js. No colour mode is set: Scalar
         follows the system, like the app and the favicon do. -->
    <script id="api-reference" data-url="openapi.json"></script>
    <script>
      // Traefik strips /api before the backend sees the request, so the server
      // cannot tell the page its public prefix. Derive it from the path the
      // browser is on (/api/docs -> /api, /docs -> /) and name it as the server:
      // the spec declares none, and "Test Request" calls /api/v1/... on the
      // review host and /v1/... on localhost:8000.
      (function () {
        var prefix = location.pathname.replace(/\/docs\/?$/, "") || "/";
        document.getElementById("api-reference").setAttribute(
          "data-configuration",
          JSON.stringify({
            withDefaultFonts: false,
            proxyUrl: null,
            telemetry: false,
            servers: [{ url: prefix }]
          })
        );
      })();
    </script>
    <script src="docs/scalar.js"></script>
  </body>
